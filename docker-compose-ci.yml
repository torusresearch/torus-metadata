services:
  # ipfs:
  #   image: ipfs/go-ipfs
  #   ports:
  #     - "5001:5001/tcp"
  redis:
    image: redis:7
    user: redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ./.env.development
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      interval: 5s
      retries: 5
      test: redis-cli --raw incr ping
      timeout: 1s
  mysql:
    image: mysql:8
    user: mysql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: --max_allowed_packet=67108864 # 64 MB
    env_file:
      - ./.env.development
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      interval: 5s
      retries: 5
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 1s
  torus-metadata:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # - ipfs
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.22.1-alpine}
    env_file:
      - ./.env.development
    command: "/app/test/run.sh"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5051/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
